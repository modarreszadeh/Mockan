[project]
name = "mockan"
version = "0.1.0"
description = "Mockan: multi-developer mock gateway (Gateway + Admin API)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<1",
    "websockets>=17,<18",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "google-re2>=1.1,<2",
    "authlib>=1.8,<2",
    "itsdangerous>=2.2,<3",
    "structlog>=26,<27",
    "joserfc>=1.7.5",
    "jinja2>=3.1,<4",
    "faker>=40,<50",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.4",
    "import-linter>=2.15",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "testcontainers[postgres]>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockan"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated constraint strings

[tool.ruff.lint.isort]
known-first-party = ["mockan"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["mockan"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship no type information (compile.py types the part of re2 it uses with a Protocol;
# oidc.py keeps the Authlib client behind `Any`).
module = ["re2", "asyncpg", "asyncpg.*", "authlib", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: needs Docker (Testcontainers PostgreSQL); skip with -m 'not db'",
    "req(id): the FR-/NFR-/PR- requirement a test covers (list with -m req --collect-only -q)",
]

[tool.importlinter]
root_package = "mockan"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: domain <- matching <- infrastructure <- gateway | admin"
type = "layers"
layers = ["mockan.gateway | mockan.admin", "mockan.infrastructure", "mockan.matching", "mockan.domain"]

[[tool.importlinter.contracts]]
name = "Gateway and Admin never import each other"
type = "independence"
modules = ["mockan.gateway", "mockan.admin"]

[[tool.importlinter.contracts]]
name = "matching stays framework- and I/O-free (arch §14 rule 5)"
type = "forbidden"
source_modules = ["mockan.matching"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "asyncpg", "httpx"]

[[tool.importlinter.contracts]]
name = "infrastructure has no web framework"
type = "forbidden"
source_modules = ["mockan.infrastructure"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "domain is standard library only"
type = "forbidden"
source_modules = ["mockan.domain"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn", "pydantic", "pydantic_settings", "httpx", "websockets",
    "sqlalchemy", "asyncpg", "alembic", "re2", "authlib", "itsdangerous", "structlog",
]
