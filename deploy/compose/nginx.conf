# Single entry point for the local stack (port 8765 on the host).
#
#   /        -> admin    (Panel)
#   /api/    -> admin    (Admin API, live-log WebSocket)
#   /mock/   -> gateway  (both replicas; the prefix is stripped, so /mock/{slug}/... is /{slug}/...)
#
# Upstreams are resolved per request through Docker's DNS, so recreating a replica needs no reload.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Behind another TLS-terminating proxy (the host's nginx), keep the scheme it saw; otherwise our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# /mock/{rest} -> /{rest}, keeping the raw request URI (query string and percent-encoding).
map $request_uri $gateway_uri {
    ~^/mock(?<rest>/.*)$ $rest;
    default              /;
}

server {
    listen 80;
    absolute_redirect off;           # the container port (80) is not the host port
    resolver 127.0.0.11 valid=5s ipv6=off;

    client_max_body_size 0;          # uploads are streamed, not capped here
    proxy_http_version 1.1;
    proxy_buffering off;             # SSE, streaming downloads
    proxy_request_buffering off;     # streaming uploads
    proxy_read_timeout 1h;           # long-lived SSE / WebSocket
    proxy_send_timeout 1h;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location = /mock {
        return 308 /mock/;
    }

    location /mock/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway$gateway_uri;
    }

    location / {
        set $admin http://admin:8081;
        proxy_pass $admin;
    }
}
